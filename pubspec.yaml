name: weather_app
description: A current-weather application for Android and iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  geolocator: ^14.0.2
  get_it: ^9.3.0
  http: ^1.6.0
  injectable: ^2.5.1
  path_provider: ^2.1.5
  protobuf: ^6.1.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^5.0.0
  injectable_generator: ^2.9.0
  protoc_plugin: ^25.1.0

flutter:
  uses-material-design: true
